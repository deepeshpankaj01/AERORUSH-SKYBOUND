<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1626"/>
      <stop offset="100%" stop-color="#04070c"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0080ff"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ff1133"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="rgba(0,240,255,0.3)" stroke-width="4"/>

  <!-- Cyber Grid Lines -->
  <path d="M 64 256 L 448 256" stroke="rgba(0,240,255,0.15)" stroke-width="2"/>
  <path d="M 96 384 L 416 384" stroke="rgba(0,240,255,0.1)" stroke-width="2"/>

  <!-- Thruster Trail Flames -->
  <polygon points="120,310 40,320 120,330" fill="url(#orangeGrad)" filter="url(#glow)"/>
  <polygon points="392,310 472,320 392,330" fill="url(#orangeGrad)" filter="url(#glow)"/>

  <!-- Hypercar Aerodynamic Silhouette (Top-Down Angled Futuristic View) -->
  <polygon points="256,90 320,180 340,280 370,320 350,370 290,360 256,380 222,360 162,370 142,320 172,280 192,180" fill="#141c2b" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Cockpit Jet Canopy -->
  <ellipse cx="256" cy="240" rx="34" ry="70" fill="url(#cyanGrad)" opacity="0.85" filter="url(#glow)"/>

  <!-- Front Splitter Strakes -->
  <path d="M 220 140 L 256 100 L 292 140" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>

  <!-- Rear Wing & Lightbar -->
  <path d="M 145 350 L 367 350" stroke="#ff0044" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Brand Typography Badge -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" letter-spacing="8" fill="#ffffff">AERORUSH</text>
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" letter-spacing="6" fill="#00f0ff">SKYBOUND</text>
</svg>
